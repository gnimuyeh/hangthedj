name = "hangthedj"
pages_build_output_dir = "public"
compatibility_date = "2024-12-01"

# ── D1 Database ──
# Create: wrangler d1 create lovetype-db
# Migrate: wrangler d1 execute lovetype-db --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "lovetype-db"
database_id = "96780fbb-c7ea-4362-9333-39596af9155d"

# ── Tencent Cloud SMS ──
# TENCENT_SECRET_ID and TENCENT_SECRET_KEY are account-level credentials and are
# deliberately NOT in this file. They live in Cloudflare's encrypted secret store:
#   wrangler pages secret put TENCENT_SECRET_ID  --project-name=hangthedj
#   wrangler pages secret put TENCENT_SECRET_KEY --project-name=hangthedj
# Rotate at https://console.cloud.tencent.com/cam/capi
#
# Alternate template: 2701475 (登录/login). 2701472 is 注册/signup, used here
# because test-takers are first-time users.
[vars]
SMS_SDK_APP_ID = "1401107635"
SMS_SIGN_NAME = "杭州知言智能科技"
SMS_TEMPLATE_ID = "2701472"
