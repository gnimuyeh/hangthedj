function calc(){
  const sum=[0,0,0,0];
  QS.forEach((q,i)=>{sum[q.d]+=ans[i]});
  const key=DIMS.map((d,i)=>sum[i]>=8?d.b:d.a).join("");
  return {key,type:TP[key],sum};
}

/* ── 合盘 ── */
function matchScore(){
  const mine=res?res.sum:[8,8,8,8];
  let total=0;
  // 佛/作：越接近越好（差异惩罚）；飘/粘：略互补；脑/心：略互补；暗/明：互补最佳
  const W=[[.75,.25],[.45,.55],[.5,.5],[.35,.65]];
  DIMS.forEach((d,i)=>{
    const diff=Math.abs(mine[i]-cp[i])/16;           // 0..1
    const sim=(1-diff)*100, comp=40+diff*60;          // 互补分随差异升高
    total+=sim*W[i][0]+comp*W[i][1];
  });
  return Math.round(total/4);
}
function matchLabel(s){
  if(s>=88)return["天造地设","你们在关键维度上高度同频，又在需要互补的地方刚好错开。这种组合非常少见——冲突少，节奏对，日子会越过越顺。"];
  if(s>=78)return["王炸组合","差异存在，但都落在能互相补位的位置上。你们大概率会互相把对方变成更好的人，前提是别把差异当成缺点。"];
  if(s>=66)return["有点意思","有明显的火花，也有明显的坎。你们需要一次坦诚的对话，把节奏和边界谈清楚，谈完就顺了。"];
  if(s>=52)return["需要磨合","你们对「什么是好的关系」理解不同。不是不能在一起，是要有人愿意先妥协，而且要说出来。"];
  return["世纪大战","这是那种在一起会很上头、也会很累的组合。可以恋爱，但请提前买好情绪保险。"];
}
function vMatch(){
  const s=matchScore(),[lab,desc]=matchLabel(s);
  const mine=res?`${res.type.ic} ${res.type.n}`:"未测试";
  return `<div class="fade">
  <div class="nav"><b>合盘鉴定</b><button onclick="go(res?'result':'intro')">返回</button></div>
  <div style="font-size:12px;color:#777;margin:18px 0 4px">你：${mine}${res?"":"（先做一次测试更准）"}</div>
  <div style="font-size:12px;color:#777;margin-bottom:8px">拖动滑块，设定 ta 在四个维度上的位置。</div>

    <input type="range" min="0" max="16" value="${cp[i]}" oninput="setCp(${i},this.value)">
  </div>`).join("")}
  <div class="score"><div class="v">${s}</div><div class="l">${lab}</div><div class="d">${desc}</div></div>
  <div class="acts"><button class="btn" onclick="share()">复制链接 · 发给 ta</button>
  <button class="btn2" onclick="go(res?'result':'intro')">返回</button></div></div>`;
}

function pick(i){
  ans[qi]=i;

}
function back(){if(qi>0){qi--;render()}}
function restart(){res=null;qi=0;ans=[];go("intro")}
function openT(k){viewT=k;go("type")}
function setCp(i,v){cp[i]=+v;render()}
function share(){
  const txt=res?`我的 DBTI 是「${res.type.n}」${res.type.ic} —— ${res.type.tg} 你呢？`:"来测测你在恋爱里是什么物种：";
  const url=location.href.split("#")[0];
  const full=txt+" "+url;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(full).then(()=>toast("已复制，去粘贴给 ta")).catch(()=>fb(full));
  }else fb(full);
}
function fb(t){
  const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity=0;
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");toast("已复制，去粘贴给 ta")}catch(e){toast("长按选中复制")}
  ta.remove();
}

function render(){
  app.innerHTML =
    ph==="intro"?vIntro():
    ph==="quiz"?vQuiz():
    ph==="result"?vResult():
    ph==="types"?vTypes():
    ph==="type"?vType():
    ph==="match"?vMatch():"";
}
render();
</script>
