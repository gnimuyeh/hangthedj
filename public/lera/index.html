 d:"你身上有一种极强的反差。别人看到的是一个冷静自持、不太表露情绪的人，但你内心的感情浓度远超所有人的想象。你不轻易开始一段关系，因为你知道自己一旦投入就是全部。在关系里你渴望深度交融——你想知道ta的一切，也愿意交出自己的一切，但这些需求你几乎从不主动说出口。你处理冲突的方式是往内收，先自己想明白，再决定要不要说。这让你显得很稳，也让你的伴侣常常不知道你到底在想什么。你需要的是一个愿意主动来敲门的人。",
 p:["感情浓度极高，认定之后毫无保留","观察入微，记得对方所有细节","不吵不闹，情绪自我消化能力强","深度陪伴的能力是十六型里最强的","忠诚，几乎不会动摇"],
 c:["需求从不主动开口，全靠对方察觉","内心戏远比表现出来的多","独占欲藏在冷静之下","受伤后会长时间沉默","不擅长处理被误解的时刻"],
 ideal:"一个表达直接、愿意先开口的人。ta能读懂你的沉默，也不介意先把话说破。你不需要热闹，你需要一个能潜到你这个深度的人。",
 best:["NERO","NEAC"],good:["NLAO","SEAC"]},

SLRO:{n:"铁面将军",en:"Iron General",ic:"🛡️",g:"SL",
 tg:"有规划有担当的关系指挥官，用行动证明一切。",
 d:"你是那种把关系当成一件正经事来经营的人。你有计划、有原则、有节奏，你说到做到，你的伴侣永远不用担心生活会失控。你的安全感来自你自己搭建的秩序，所以别人的情绪波动很难影响你。你不太会说甜言蜜语，但你会把ta的证件、体检、生日、行程全部记在心里并安排妥当——在你的世界里，这就是最高级别的爱。你保留自己的边界，也严格尊重对方的。你的挑战在于：不是所有人都能从一张排得明明白白的日程表里读出深情。",
 p:["责任感和执行力极强","关系有秩序，几乎不会失控","承诺一旦给出就绝对兑现","危机时刻最靠得住的那个人","边界清晰，不越界也不被越界"],
 c:["情绪表达偏硬，柔软度不足","计划被打乱时会明显不悦","不太懂得制造浪漫和惊喜","有时把关系管理得像项目","不习惯说「我需要你」"],
 ideal:"一个感性、有生活情趣、能把你的秩序变得有温度的人。ta负责让日子生动，你负责让日子稳当。",
 best:["NEAO","NEAC"],good:["NERC","SEAC"]},

SLRC:{n:"灯塔守望者",en:"Lighthouse Keeper",ic:"🏰",g:"SL",
 tg:"理性忠诚的守护者，为爱筑起最安全的港湾。",
 d:"你是十六型里最能给人安全感的类型。你稳定、可靠、有长期视角，你会把两个人的未来一步步规划清楚，然后一件件落实。你渴望深度的交融——你希望两个人共享生活的绝大部分，也愿意为此调整自己。但你的表达方式始终是理性的：你不会说「我很想你」，你会说「我把周末的时间空出来了」。你的伴侣会在很多年后才完全明白你给的是什么。你要学的是允许自己偶尔失控一下，让对方看到你也会怕、也会累。",
 p:["安全感的天花板，让人无比安心","长期主义者，关系越久越好","把承诺当成不可动摇的事","照顾细节，把生活打理得妥帖","冲突中始终保持理性和克制"],
 c:["灵活性偏低，变化会让你紧张","对亲密的需求高但表达含蓄","容易替对方做决定","不擅长处理自己的脆弱","关系里的控制感需要警惕"],
 ideal:"一个自由灵动、情绪外放的人。ta带你出门看世界，你带ta回家。你们的差异越大，反而越互补。",
 best:["NEAO","NERC"],good:["SEAC","NEAC"]},

SEAO:{n:"吟游歌者",en:"Wandering Bard",ic:"🎵",g:"SE",
 tg:"感性浪漫又保持自我，爱是灵感而非枷锁。",
 d:"你的内心世界丰富到能自给自足。你感性、细腻、共情能力强，但你的安全感不依赖任何人——这个组合非常罕见。你在关系里给出的是理解和温度，同时坚持保留自己的空间和节奏。你讨厌被安排，也不会去安排别人。爱情对你来说更像是灵感的来源，而不是人生的组织架构。你会为ta写下很多东西、记住很多瞬间，但你也需要一个人待着的时间来消化这些。跟你在一起的人会觉得被深深理解，同时也永远抓不住你的全部。",
 p:["共情能力强，情绪价值给得足","情绪稳定又感性，非常难得","不占有、不控制，给足自由","生活有审美和情趣","懂得欣赏对方的独特之处"],
 c:["承诺时会犹豫，怕失去自我","需要独处，对方可能感到被推开","不喜欢被规划和被安排","逃避冲突，倾向于回避","有时活在自己的世界里"],
 ideal:"一个热烈、主动、能把你从自己的世界里拉出来的人。ta的强度不会吓到你，因为你稳；ta的投入会让你终于愿意停下来。",

SEAC:{n:"月光治愈师",en:"Moonlight Healer",ic:"🌙",g:"SE",
 tg:"温柔细腻的灵魂伴侣，用共情治愈一切疲惫。",

 p:["共情和抚慰能力是十六型第一","让对方感到被完全接纳","不评判、不施压、不比较","情感表达真诚且自然","关系里的修复能力极强"],
 c:["过度照顾对方，忽略自己","不擅长提出自己的需求","冲突时容易先妥协","吸收太多别人的情绪","边界感偏弱，容易被消耗"],
 ideal:"一个有力量、有主见、愿意主动扛事的人。ta不需要你治愈，但会珍惜你的治愈；ta负责在前面挡风，你负责让家有温度。",

SERO:{n:"花园建筑师",en:"Garden Architect",ic:"🌿",g:"SE",
 tg:"内在丰富不张扬，用耐心经营最有质感的关系。",
 d:"你是那种把关系当成一座花园来照料的人——不追求瞬间的绚烂，而是一年一年地把它养好。你感性但不外放，有规律但不僵硬，你相信好的关系是耐心浇出来的。你保留自己的独立空间，也从不侵占对方的。在冲突里你会先照顾情绪再谈事情，方式温和但立场清楚。你的伴侣可能要过很久才意识到：这段关系之所以这么舒服，是因为你在背后做了大量看不见的经营。",
 p:["经营关系的耐心和长性极强","温和但有原则，不容易被推着走","懂生活，把日子过得有质感","冲突处理温和，很少激化","尊重边界，从不越界"],
 c:["主动性偏低，习惯等待","不太表达自己的委屈","变化和意外会让你不适","有时过于克制，缺少激情","慢热到对方以为你不感兴趣"],

SERC:{n:"永恒誓约者",en:"Eternal Vow",ic:"💍",g:"SE",

 p:["专一和忠诚是十六型的顶点","愿意为关系长期投入","情感深厚且稳定","把家和未来看得极重","给对方极强的归属感"],

NLAO:{n:"闪电猎手",en:"Lightning Hunter",ic:"⚡",g:"NL",
 tg:"充满魅力的自由战士，用实力让人无法抗拒。",

NLAC:{n:"烈焰锻造师",en:"Flame Forger",ic:"🔥",g:"NL",

NLRO:{n:"王座执政官",en:"Throne Regent",ic:"👑",g:"NL",

 p:["领导力和决断力极强","目标清晰，关系有明确方向","可靠有担当，说到做到","抗压能力强，关键时刻顶得住","独立，不会缠住对方"],

};

const KEYS=Object.keys(TP);

/* ══════════ state ══════════ */
let ph="intro",qi=0,ans=[],res=null,viewT=null,partner="SEAC";
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function setAc(c){document.documentElement.style.setProperty("--ac",c)}
function go(p){ph=p;window.scrollTo(0,0);render()}
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;
  document.body.appendChild(e);setTimeout(()=>e.remove(),1700)}

function calc(){
  const raw=[0,0,0,0];
  QS.forEach((q,i)=>{raw[q.d]+=W[ans[i]]});   // 每维 -16 .. +16
  const key=DIMS.map((d,i)=>raw[i]<0?d.a:d.b).join("");
  return {key,type:TP[key],raw};
}

/* ══════════ views ══════════ */
function vIntro(){
  setAc("#1B3A5C");
  return `<div class="intro fade">
    <div class="mark">LOVE · EMOTION · RELATIONSHIP · ASSESSMENT</div>
    <h1>LERA</h1>
    <div class="expand">16 型恋爱人格测评</div>
    <div class="lede">不是又一个 MBTI 翻版。<br>四个维度，只讲一件事——<br>你在亲密关系里，究竟是个什么样的人。</div>
    <hr>
    <div class="dimlist">
      ${DIMS.map(d=>`<div class="dimrow"><b>${d.an} ${d.a} / ${d.b} ${d.bn}</b><span>${d.t}</span></div>`).join("")}
    </div>
    <button class="btn" onclick="start()">开始测评</button>
    <div style="height:10px"></div>
    <button class="btn2" onclick="go('types')">先浏览 16 型</button>
    <div class="foot">32 道场景题，约 5 分钟。<br>没有标准答案，凭第一直觉选。</div>
  </div>`;
}

function vQuiz(){
  const q=QS[qi],d=DIMS[q.d];
  return `<div class="qtop">
    <div class="qmeta"><span>${String(qi+1).padStart(2,"0")} / 32</span><span>${d.t}</span></div>
    <div class="track"><i style="width:${(qi/32)*100}%"></i></div>
  </div>
  <div class="qbody fade">
    <div class="qtext">${esc(q.t)}</div>
    ${q.o.map((o,i)=>`<button class="opt" onclick="pick(${i})">${esc(o)}</button>`).join("")}
  </div>
  <div class="qfoot">${qi>0?`<button class="btn2" onclick="back()">上一题</button>`:""}</div>`;
}

function spectrum(raw){
  return DIMS.map((d,i)=>{
    const pct=((raw[i]+16)/32)*100, right=raw[i]>=0;
    return `<div class="sp">
      <b class="${right?"":"on"}">${d.a} ${d.an}</b>
      <div class="tr"><i style="left:${Math.max(3,Math.min(97,pct))}%"></i></div>
      <b class="r ${right?"on":""}">${d.bn} ${d.b}</b></div>`;
  }).join("");
}

function typeCard(key,raw){
  const t=TP[key],g=GRP[t.g];
  return `<div class="hero">
    <div class="grp">${g.n} · ${g.en.toUpperCase()}</div>
    <div class="sym">${t.ic}</div>
    <div class="code">${key}</div>
    <div class="tname">${t.n}</div>
    <div class="ten">${t.en}</div>
    <div class="tline">${esc(t.tg)}</div>
    ${raw?`<div class="spec">${spectrum(raw)}</div>`:""}
    <div class="sig">LERA · 16 型恋爱人格测评</div>
  </div>`;
}

function body(t){
  return `
  <h4>人格画像</h4><div class="hr2"></div><div class="para">${esc(t.d)}</div>
  <h4>你的恋爱超能力</h4><div class="hr2"></div>
  <ul class="lst">${t.p.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
  <h4>你的恋爱功课</h4><div class="hr2"></div>
  <ul class="lst">${t.c.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
  <h4>你的理想伴侣</h4><div class="hr2"></div><div class="para q">${esc(t.ideal)}</div>
  <h4>最佳拍档</h4><div class="hr2"></div>
  <div class="pair">${t.best.map(k=>`<span class="pill">${TP[k].ic} ${TP[k].n}<i>${k}</i></span>`).join("")}</div>
  <h4>良好拍档</h4><div class="hr2"></div>
  <div class="pair">${t.good.map(k=>`<span class="pill">${TP[k].ic} ${TP[k].n}<i>${k}</i></span>`).join("")}</div>`;
}

function vResult(){
  const t=res.type;setAc(GRP[t.g].c);
  return `<div class="fade">${typeCard(res.key,res.raw)}${body(t)}
  <div class="acts">
    <button class="btn" onclick="share()">复制链接 · 邀请 ta 来测</button>
    <button class="btn2" onclick="go('match')">合盘 · 你们的适配度</button>
    <button class="btn2" onclick="go('types')">浏览全部 16 型</button>
    <button class="btn2" onclick="restart()">重新测评</button>
  </div></div>`;
}

function vTypes(){
  if(!res)setAc("#1B3A5C");
  const groups=["SL","SE","NL","NE"];
  return `<div class="fade">
  <div class="nav"><b>16 型恋爱人格</b><button onclick="go(res?'result':'intro')">返回</button></div>
  ${groups.map(g=>`<div class="gsec">
    <div class="ghd"><span class="gdot" style="background:${GRP[g].c}"></span>
      <span style="color:${GRP[g].c}">${GRP[g].n}</span></div>
    <div class="grid">
      ${KEYS.filter(k=>TP[k].g===g).map(k=>`<button class="gcell" style="border-left-color:${GRP[g].c}" onclick="openT('${k}')">
        <div class="i">${TP[k].ic}</div><div class="n">${TP[k].n}</div><div class="c">${k}</div></button>`).join("")}
    </div></div>`).join("")}
  <div class="acts"><button class="btn2" onclick="go(res?'result':'intro')">返回</button></div></div>`;
}

function vType(){
  const t=TP[viewT];setAc(GRP[t.g].c);
  return `<div class="fade">
  <div class="nav"><b>${t.n}</b><button onclick="go('types')">返回列表</button></div>
  ${typeCard(viewT,null)}${body(t)}
  <div class="acts"><button class="btn2" onclick="go('types')">返回列表</button></div></div>`;
}

/* ── 合盘：相似性 / 互补性加权 ── */
const RULE=[
 {same:98,diff:55,w:"高度看相似",why:"安全感模式不同的两个人，一个不断确认、一个觉得没必要，是最常见的消耗来源。"},
 {same:88,diff:80,w:"相似略优",why:"处理冲突的方式接近会更省力，但一理性一感性也能互相补位，差异影响不大。"},
 {same:95,diff:62,w:"高度看相似",why:"生活节奏是每天都要面对的事。一个要计划一个要随性，会在无数小事上摩擦。"},
 {same:68,diff:95,w:"明显看互补",why:"边界需求一致反而容易出问题：两个都要空间会疏远，两个都要交融会窒息。一推一拉才是健康的。"},
];
function matchCalc(a,b){
  const per=DIMS.map((d,i)=>{
    const same=a[i]===b[i];
    return {i,same,score:same?RULE[i].same:RULE[i].diff};
  });
  const total=Math.round(per.reduce((s,p)=>s+p.score,0)/4);
  return {per,total};
}
function matchLabel(s){
  if(s>=88)return["天造地设","你们在最需要一致的维度上高度同频，又在最需要错开的地方刚好互补。这种组合非常少见，相处成本极低。"];
  if(s>=80)return["高度契合","核心节奏对得上，差异也落在能互相补位的位置。你们大概率会越处越顺。"];
  if(s>=72)return["值得一试","有明确的火花，也有明确的坎。把节奏和边界谈清楚，这段关系就成立了。"];
  if(s>=64)return["需要磨合","你们对「好的关系是什么样」的理解不同。不是不合适，是要有人先说出来，并且有人愿意调整。"];
  return["高消耗组合","在关键维度上你们的需求相反。可以很上头，但长期需要非常多的沟通和让步。"];
}
function vMatch(){
  const mine=res?res.key:null;
  if(!mine){return `<div class="fade"><div class="nav"><b>合盘</b><button onclick="go('intro')">返回</button></div>
    <div class="para" style="margin-top:28px">合盘需要先知道你的类型。<br>做完 32 道题之后再回来吧。</div>
    <div class="acts"><button class="btn" onclick="start()">开始测评</button></div></div>`}
  const m=matchCalc(mine,partner),[lab,desc]=matchLabel(m.total);
  const pt=TP[partner];
  return `<div class="fade">
  <div class="nav"><b>合盘鉴定</b><button onclick="go('result')">返回</button></div>
  <div class="dt" style="border-bottom:1px solid var(--line);padding:16px 0">
    <b>${res.type.ic} ${res.type.n}</b><span>你 · ${mine}</span></div>
  <div style="margin-top:16px"><div class="lbl" style="margin-bottom:9px">选择 TA 的类型</div>
  <select class="sel" onchange="setP(this.value)">
    ${KEYS.map(k=>`<option value="${k}" ${k===partner?"selected":""}>${TP[k].ic} ${TP[k].n} · ${k}</option>`).join("")}
  </select></div>
  <div class="score"><div class="v">${m.total}<em> / 100</em></div>
    <div class="l">${lab}</div><div class="d">${desc}</div></div>
  <h4>逐维度拆解</h4><div class="hr2"></div>
  <div class="dimtbl">${m.per.map(p=>{
    const d=DIMS[p.i],ok=(p.same&&RULE[p.i].same>=RULE[p.i].diff)||(!p.same&&RULE[p.i].diff>RULE[p.i].same);
    return `<div class="dt"><div><b>${d.t}</b><br><span>你 ${mine[p.i]} · ta ${partner[p.i]} —— ${RULE[p.i].w}</span></div>
    <span class="tag" style="${ok?`color:var(--ac);border-color:var(--ac)`:""}">${ok?"加分":"需注意"}</span></div>`;
  }).join("")}</div>
  <div class="note">LERA 的合盘不是「越像越配」。安全感模式和生活节奏这两个维度看相似，冲突处理影响较小，而亲密边界恰恰要互补——一个要空间、一个要靠近，才推得动。</div>
  <h4>ta 是什么样的人</h4><div class="hr2"></div><div class="para q">${esc(pt.d)}</div>
  <div class="acts"><button class="btn" onclick="share()">复制链接 · 邀请 ta 来测</button>
  <button class="btn2" onclick="go('result')">返回我的报告</button></div></div>`;
}

/* ══════════ actions ══════════ */
function start(){qi=0;ans=[];go("quiz")}
function pick(i){ans[qi]=i;if(qi<31){qi++;render()}else{res=calc();try{localStorage.setItem("lera",res.key)}catch(e){}go("result")}}
function back(){if(qi>0){qi--;render()}}
function restart(){res=null;qi=0;ans=[];go("intro")}
function openT(k){viewT=k;go("type")}
function setP(k){partner=k;render()}
function share(){
  const txt=res?`我的 LERA 恋爱人格是 ${res.key}「${res.type.n}」${res.type.ic} —— ${res.type.tg} 你是哪一型？`:"LERA · 16 型恋爱人格测评：";
  const full=txt+" "+location.href.split("#")[0];
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(full).then(()=>toast("已复制，去粘贴给 ta")).catch(()=>fb(full));
  }else fb(full);
}
function fb(t){const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity=0;
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");toast("已复制，去粘贴给 ta")}catch(e){toast("长按选中复制")}
  ta.remove()}

function render(){
  app.innerHTML =
    ph==="intro"?vIntro(): ph==="quiz"?vQuiz(): ph==="result"?vResult():
    ph==="types"?vTypes(): ph==="type"?vType(): ph==="match"?vMatch():"";
}
render();
</script>
</body>
</html>
